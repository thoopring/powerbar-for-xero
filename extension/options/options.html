<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Settings</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <h1>Modules</h1>
  <p class="hint">Every feature can be switched off individually.</p>
  <div id="modules"></div>

  <h1>Pro license</h1>
  <p class="hint">Pro features need a license key. Nothing else ever leaves your browser.</p>
  <div class="license-row">
    <input id="license-key" type="text" placeholder="XXXX-XXXX-XXXX-XXXX" spellcheck="false" />
    <button id="license-save">Activate</button>
  </div>
  <p id="license-status"></p>

  <script src="../src/catalog.js"></script>
  <script src="options.js"></script>
</body>
</html>
